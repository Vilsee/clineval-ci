# ClinEval-CI gate policy (version-controlled, reviewed like code)
tolerance: 0.0            # allowed drop in pass rate before a regression counts
confidence: 0.95          # confidence level of the bootstrap interval
bootstrap_samples: 5000
min_cases: 5              # fewer comparable cases than this -> inconclusive (WARN)
block_on_critical: true   # any NEW critical forbidden-behaviour detection blocks the merge
quarantine_flaky: true    # non-safety cases that are flaky in the baseline never block
max_token_ratio: 1.5      # WARN if average tokens per trial grows beyond 1.5x baseline
