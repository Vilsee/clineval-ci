<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClinEval-CI dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F7F6F3; --card:#FFFFFF; --ink:#111111; --body:#2F3437; --mut:#787774; --line:#EAEAEA; --key:#F7F6F3;
  --red-bg:#FDEBEC; --red:#9F2F2D; --blue-bg:#E1F3FE; --blue:#1F6C9F; --green-bg:#EDF3EC; --green:#346538; --yellow-bg:#FBF3DB; --yellow:#956400;
  --sans:'Geist','SF Pro Display','Helvetica Neue',system-ui,sans-serif;
  --serif:'Newsreader','Lyon Text','Playfair Display',Georgia,serif;
  --mono:'Geist Mono','SF Mono','JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--body);font:15px/1.6 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header.top{background:rgba(247,246,243,.9);backdrop-filter:blur(6px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.brand{font:500 22px/1 var(--serif);letter-spacing:-.03em;color:var(--ink);text-decoration:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1}
nav.tabs a{padding:7px 12px;border-radius:6px;text-decoration:none;color:var(--mut);font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
nav.tabs a:hover{color:var(--ink);background:#efeeea}
nav.tabs a[aria-current=page]{color:var(--ink);background:#fff;border:1px solid var(--line)}
.site{font-size:13px;color:var(--mut);text-decoration:none}
main{max-width:1120px;margin:0 auto;padding:48px 24px 120px}
h1{font:400 clamp(32px,4vw,46px)/1.1 var(--serif);letter-spacing:-.03em;color:var(--ink);margin:0 0 8px}
h2{font:500 22px/1.2 var(--serif);letter-spacing:-.02em;color:var(--ink);margin:0 0 14px}
.lede{color:var(--mut);max-width:62ch;margin:0 0 36px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;transition:box-shadow .2s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.04)}
.s3{grid-column:span 3} .s4{grid-column:span 4} .s5{grid-column:span 5} .s6{grid-column:span 6} .s7{grid-column:span 7} .s8{grid-column:span 8} .s12{grid-column:span 12}
@media (max-width:860px){.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.stat .v{font:400 40px/1 var(--serif);letter-spacing:-.03em;color:var(--ink)}
.stat .l{color:var(--mut);font-size:13px;margin-top:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:14px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--mut);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-height:40px}
textarea{width:100%;font-family:var(--mono);font-size:13px;line-height:1.5}
button.btn{font:500 14px var(--sans);background:#111;color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;min-height:40px;transition:background .2s,transform .15s}
button.btn:hover{background:#333} button.btn:active{transform:scale(.98)} button.btn:disabled{opacity:.5;cursor:wait}
button.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)} button.btn.alt:hover{background:var(--canvas)}
button.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.badge{display:inline-block;border-radius:9999px;padding:2px 10px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green)} .b-red{background:var(--red-bg);color:var(--red)} .b-yellow{background:var(--yellow-bg);color:var(--yellow)} .b-blue{background:var(--blue-bg);color:var(--blue)} .b-gray{background:#efeeea;color:var(--mut)}
.verdict{font:400 34px/1 var(--serif);letter-spacing:-.03em}
.verdict.PASS{color:var(--green)} .verdict.WARN{color:var(--yellow)} .verdict.BLOCK{color:var(--red)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--mut);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.mut{color:var(--mut)}
ul.clean{margin:0;padding:0;list-style:none;display:grid;gap:8px}
details{border-bottom:1px solid var(--line);padding:10px 0} details:last-child{border-bottom:0}
summary{cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.trace{margin:10px 0 4px;padding:14px;background:var(--canvas);border-radius:8px;font-size:13px;display:grid;gap:8px}
kbd{font:12px var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--key);padding:1px 6px}
pre{margin:0;font:13px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word}
dialog{border:1px solid var(--line);border-radius:12px;padding:28px;max-width:440px;width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.08)}
dialog::backdrop{background:rgba(17,17,17,.25)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;z-index:30}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 13px var(--sans);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--body)}
.chip:hover,.chip[aria-pressed=true]{background:#111;color:#fff;border-color:#111}
.tl{border-left:1px solid var(--line);margin-left:6px;padding-left:18px;display:grid;gap:14px}
.tl li{position:relative;list-style:none}
.tl li::before{content:"";position:absolute;left:-23px;top:8px;width:9px;height:9px;border-radius:50%;background:#111}
@media (prefers-reduced-motion:no-preference){
  .view>*{animation:rise .6s var(--ease) both}
  .view>*:nth-child(2){animation-delay:.06s} .view>*:nth-child(3){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/app">ClinEval-CI</a>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <a class="site" href="/">About</a>
</div></header>
<main id="main" class="view" tabindex="-1"></main>
<dialog id="dlg"></dialog>

<script>
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const pct = x => (x * 100).toFixed(1) + '%';
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { const j = await r.json(); m = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) {} throw new Error(m); }
  return r.json();
}
const post = (p, body) => api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
function toast(t) { const n = h('div', { class: 'toast', role: 'status' }, t); document.body.append(n); setTimeout(() => n.remove(), 2600); }
const badge = (text, kind) => h('span', { class: 'badge b-' + kind }, text);
const verdictKind = v => ({ PASS: 'green', WARN: 'yellow', BLOCK: 'red' }[v]);
const classKind = c => ({ regressed: 'red', fixed: 'green', 'stable-pass': 'green', 'stable-fail': 'red', flaky: 'yellow' }[c] || 'gray');

const S = { runs: [], baselineId: null, suite: null, policy: null };
async function refresh() {
  const [r, s, p] = await Promise.all([api('/api/runs'), api('/api/suite'), api('/api/policy')]);
  S.runs = r.runs; S.baselineId = r.baseline_id; S.suite = s; S.policy = p;
}

/* ---------- shared pieces ---------- */
function runControls(onDone) {
  const agent = h('select', { id: 'ag' }, S.suite.agents.map(a => h('option', { value: a }, a === 'v2' ? 'v2 (regressed)' : a)));
  const trials = h('input', { type: 'number', min: 1, max: 20, value: 5, style: 'width:72px' });
  const msg = h('p', { class: 'mut', style: 'margin:0;min-height:22px', 'aria-live': 'polite' });
  const run = h('button', { class: 'btn' }, 'Run suite');
  const demo = h('button', { class: 'btn alt' }, 'Demo: v1 then v2');
  async function go(fn) { run.disabled = demo.disabled = true; try { await fn(); await refresh(); onDone(); } catch (e) { msg.textContent = 'Error: ' + e.message; } finally { run.disabled = demo.disabled = false; } }
  run.onclick = () => go(async () => { msg.textContent = 'Running...'; const r = await post('/api/run', { agent: agent.value, trials: +trials.value });
    msg.textContent = `Run #${r.id} done.` + (r.gate ? ` Gate: ${r.gate.verdict}.` : ' Saved as baseline.'); });
  demo.onclick = () => go(async () => { msg.textContent = 'Running v1 as baseline...'; await post('/api/run', { agent: 'v1', trials: +trials.value, set_baseline: true });
    msg.textContent = 'Running regressed v2...'; const r = await post('/api/run', { agent: 'v2', trials: +trials.value }); msg.textContent = `Gate verdict for v2: ${r.gate.verdict}.`; });
  return h('div', { class: 'stack' }, h('div', { class: 'row' },
    h('label', { class: 'f' }, 'Agent', agent), h('label', { class: 'f' }, 'Trials', trials), h('div', { class: 'row', style: 'align-self:end' }, run, demo)), msg);
}

function trendChart(runs) {
  const rs = runs.slice().reverse().slice(-20), W = 640, H = 190, P = 28;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Pass rate by run'); svg.style.width = '100%';
  const ns = (t, a) => { const e = document.createElementNS('http://www.w3.org/2000/svg', t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const x = i => rs.length < 2 ? W / 2 : P + i * (W - 2 * P) / (rs.length - 1), y = v => H - P - v * (H - 2 * P);
  [0, .5, 1].forEach(t => { svg.append(ns('line', { x1: P, x2: W - P, y1: y(t), y2: y(t), stroke: '#EAEAEA' })); const tx = ns('text', { x: 0, y: y(t) + 4, 'font-size': 11, fill: '#787774' }); tx.textContent = Math.round(t * 100); svg.append(tx); });
  [['overall_pass_rate', '#111111'], ['safety_pass_rate', '#346538']].forEach(([k, c]) => {
    if (rs.length > 1) svg.append(ns('polyline', { points: rs.map((r, i) => `${x(i)},${y(r[k])}`).join(' '), fill: 'none', stroke: c, 'stroke-width': 2 }));
    rs.forEach((r, i) => svg.append(ns('circle', { cx: x(i), cy: y(r[k]), r: 3.5, fill: c })));
  });
  rs.forEach((r, i) => { const t = ns('text', { x: x(i), y: H - 6, 'font-size': 11, fill: '#787774', 'text-anchor': 'middle' }); t.textContent = '#' + r.id; svg.append(t); });
  return svg;
}

/* ---------- views ---------- */
async function overview() {
  const latest = S.runs[0], base = S.runs.find(r => r.id === S.baselineId);
  const stat = (v, l, c) => h('div', { class: 'card stat ' + c }, h('div', { class: 'v' }, v), h('div', { class: 'l' }, l));
  const gateCard = h('div', { class: 'card s8' }, h('h2', null, 'Latest gate result'), h('p', { class: 'mut' }, 'Run the suite to see how the newest run compares with the baseline.'));
  if (latest && base && latest.id !== base.id) {
    const c = await api('/api/compare?candidate=' + latest.id);
    gateCard.replaceChildren(h('h2', null, 'Latest gate result'),
      h('div', { class: 'row', style: 'margin-bottom:12px' }, h('span', { class: 'verdict ' + c.verdict }, c.verdict === 'BLOCK' ? 'Merge blocked' : c.verdict === 'WARN' ? 'Merge with caution' : 'Merge allowed'),
        badge(`run #${latest.id} vs baseline #${base.id}`, 'gray')),
      h('ul', { class: 'clean' }, c.reasons.map(r => h('li', null, r))),
      h('p', null, h('a', { href: '#/compare' }, 'Open the full comparison')));
  } else if (latest && base) gateCard.replaceChildren(h('h2', null, 'Latest gate result'), h('p', { class: 'mut' }, 'The newest run is the baseline. Run a candidate to compare.'));
  return h('div', null,
    h('h1', null, 'Overview'), h('p', { class: 'lede' }, 'Regression gate for clinical AI agents. Synthetic data only; a pass here is not evidence of clinical safety.'),
    h('div', { class: 'grid' },
      h('div', { class: 's4' }, stat(base ? '#' + base.id : 'none', 'Baseline run' + (base ? ` (${base.agent})` : ''), '')),
      h('div', { class: 's4' }, stat(latest ? pct(latest.overall_pass_rate) : '-', 'Latest overall pass rate', '')),
      h('div', { class: 's4' }, stat(latest ? pct(latest.safety_pass_rate) : '-', 'Latest safety pass rate', '')),
      gateCard,
      h('div', { class: 'card s4' }, h('h2', null, 'Run the suite'), runControls(() => route())),
      h('div', { class: 'card s12' }, h('h2', null, 'Pass rate by run'), h('div', { class: 'row', style: 'margin-bottom:6px' }, badge('overall', 'gray'), badge('safety', 'green')),
        S.runs.length ? trendChart(S.runs) : h('p', { class: 'mut' }, 'No runs yet.'))));
}

function runs() {
  const detail = h('div');
  async function show(id) {
    const r = await api('/api/runs/' + id);
    detail.replaceChildren(h('div', { class: 'card', style: 'margin-top:16px' },
      h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:10px' }, h('h2', { style: 'margin:0' }, `Run #${id}: ${r.resolved_agent}`),
        h('div', { class: 'row' }, h('button', { class: 'btn alt sm', onclick: async () => { await api('/api/baseline/' + id, { method: 'POST' }); await refresh(); toast('Baseline set to run #' + id); route(); } }, 'Set as baseline'),
          h('a', { class: 'btn alt sm', style: 'text-decoration:none;padding:6px 10px', href: '/api/runs/' + id, download: `run-${id}.json` }, 'JSON'))),
      r.results.map(c => h('details', null,
        h('summary', null, h('span', { class: 'mono mut' }, c.case_id), h('span', null, c.title), badge(pct(c.pass_rate), c.pass_rate === 1 ? 'green' : c.pass_rate === 0 ? 'red' : 'yellow'),
          c.flaky ? badge('flaky', 'yellow') : null, c.detections.map(d => badge(d.severity + ': ' + d.id, d.severity === 'critical' ? 'red' : 'yellow'))),
        h('div', { class: 'trace' }, c.trials.map(t => h('div', null, h('div', { class: 'row' }, badge('trial ' + (t.trial + 1), 'gray'), badge(t.passed ? 'pass' : 'fail', t.passed ? 'green' : 'red'),
          h('span', { class: 'mono mut' }, 'tools: ' + (t.tools.join(' > ') || 'none'))), h('div', null, t.final),
          t.passed ? null : h('div', { class: 'mut' }, 'Failed checks: ' + t.checks.filter(k => !k.ok).map(k => k.name).join('; ')))))))));
    detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  const rows = S.runs.map(r => h('tr', null, h('td', { class: 'mono' }, '#' + r.id), h('td', null, r.agent, r.id === S.baselineId ? [' ', badge('baseline', 'blue')] : null),
    h('td', { class: 'n' }, r.n_cases), h('td', { class: 'n' }, pct(r.overall_pass_rate)), h('td', { class: 'n' }, pct(r.safety_pass_rate)),
    h('td', { class: 'n' }, r.critical_detections), h('td', { class: 'n' }, r.flaky_cases), h('td', { class: 'n' }, r.avg_tokens), h('td', { class: 'mono' }, r.suite_hash),
    h('td', null, h('button', { class: 'btn alt sm', onclick: () => show(r.id) }, 'View'))));
  return h('div', null, h('h1', null, 'Runs'), h('p', { class: 'lede' }, 'Every run is stored with its full trajectory. Open one to inspect each trial.'),
    h('div', { class: 'card' }, h('h2', null, 'Run a new one'), runControls(() => route())),
    h('div', { class: 'card', style: 'margin-top:16px;padding:12px 16px' }, S.runs.length ? h('div', { class: 'wrap' }, h('table', null,
      h('thead', null, h('tr', null, ['Run', 'Agent', 'Cases', 'Overall', 'Safety', 'Critical', 'Flaky', 'Avg tokens', 'Suite', ''].map((t, i) => h('th', { class: i > 1 && i < 8 ? 'n' : '' }, t)))), h('tbody', null, rows))) : h('p', { class: 'mut', style: 'padding:16px' }, 'No runs yet.')),
    detail);
}

function ciBar(m) {
  const W = 220, x = v => Math.max(0, Math.min(W, (v + 1) / 1.25 * W)), ns = (t, a) => { const e = document.createElementNS('http://www.w3.org/2000/svg', t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = ns('svg', { viewBox: `0 0 ${W} 24`, width: W, height: 24, role: 'img', 'aria-label': `difference ${(m.diff * 100).toFixed(1)}%, interval ${(m.ci_low * 100).toFixed(1)} to ${(m.ci_high * 100).toFixed(1)}` });
  svg.append(ns('line', { x1: 0, x2: W, y1: 12, y2: 12, stroke: '#EAEAEA' }), ns('line', { x1: x(0), x2: x(0), y1: 3, y2: 21, stroke: '#787774' }),
    ns('line', { x1: x(m.ci_low), x2: x(m.ci_high), y1: 12, y2: 12, stroke: m.status.startsWith('confirmed') ? '#9F2F2D' : '#111', 'stroke-width': 3 }),
    ns('circle', { cx: x(m.diff), cy: 12, r: 4.5, fill: m.status.startsWith('confirmed') ? '#9F2F2D' : '#111' }));
  return svg;
}

function openWaive(caseId, done) {
  const d = $('#dlg'), exp = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
  const reason = h('input', { required: true, minlength: 3, placeholder: 'Why is this acceptable?' }), who = h('input', { required: true, minlength: 2, placeholder: 'Approver name' }), when = h('input', { type: 'date', value: exp, required: true });
  const err = h('p', { class: 'mut', style: 'margin:0;color:#9F2F2D' });
  d.replaceChildren(h('form', { class: 'stack', method: 'dialog', onsubmit: async e => { e.preventDefault(); try { await post('/api/waivers', { case_id: caseId, reason: reason.value, approver: who.value, expires_at: when.value }); d.close(); toast('Waiver added for ' + caseId); done(); } catch (x) { err.textContent = x.message; } } },
    h('h2', { style: 'margin:0' }, 'Waive ' + caseId), h('p', { class: 'mut', style: 'margin:0' }, 'A waiver lets this case through until the expiry date and stays visible in every report.'),
    h('label', { class: 'f' }, 'Reason', reason), h('label', { class: 'f' }, 'Approver', who), h('label', { class: 'f' }, 'Expires', when), err,
    h('div', { class: 'row' }, h('button', { class: 'btn', type: 'submit' }, 'Add waiver'), h('button', { class: 'btn alt', type: 'button', onclick: () => d.close() }, 'Cancel'))));
  d.showModal();
}

async function compareView() {
  const opt = r => h('option', { value: r.id }, `#${r.id} (${r.agent})`);
  const base = h('select', null, S.runs.map(opt)), cand = h('select', null, S.runs.map(opt)), out = h('div', { class: 'stack', style: 'margin-top:16px' });
  if (S.baselineId) base.value = S.baselineId; if (S.runs.length) cand.value = S.runs[0].id;
  async function go() {
    if (!S.runs.length) { out.replaceChildren(h('p', { class: 'mut' }, 'Run the suite first.')); return; }
    const q = `baseline=${base.value}&candidate=${cand.value}`, c = await api('/api/compare?' + q);
    const metricRows = [...Object.values(c.metrics), ...Object.values(c.tags)].map(m => h('tr', null, h('td', null, m.name), h('td', { class: 'n' }, pct(m.baseline)), h('td', { class: 'n' }, pct(m.candidate)),
      h('td', null, ciBar(m)), h('td', { class: 'n' }, `${(m.diff * 100).toFixed(1)}% (${(m.ci_low * 100).toFixed(1)} to ${(m.ci_high * 100).toFixed(1)})`),
      h('td', null, badge(m.status, m.status.startsWith('confirmed') ? 'red' : m.status.startsWith('possible') ? 'yellow' : 'green'))));
    const critCases = new Set(c.new_critical.map(x => x.case_id));
    const caseRows = c.cases.map(x => h('tr', null, h('td', { class: 'mono' }, x.case_id), h('td', null, x.title), h('td', { class: 'n' }, pct(x.baseline)), h('td', { class: 'n' }, pct(x.candidate)),
      h('td', null, badge(x.class, classKind(x.class)), x.quarantined ? [' ', badge('quarantined', 'blue')] : null, x.waived ? [' ', badge('waived', 'blue')] : null),
      h('td', null, (x.class === 'regressed' || critCases.has(x.case_id)) && !x.waived ? h('button', { class: 'btn alt sm', onclick: () => openWaive(x.case_id, go) }, 'Waive') : null)));
    out.replaceChildren(
      h('div', { class: 'card' }, h('div', { class: 'row', style: 'justify-content:space-between' }, h('span', { class: 'verdict ' + c.verdict }, c.verdict === 'BLOCK' ? 'Merge blocked' : c.verdict === 'WARN' ? 'Merge with caution' : 'Merge allowed'),

      h('div', { class: 'card', style: 'padding:12px 16px' }, h('div', { class: 'wrap' }, h('table', null, h('thead', null, h('tr', null, ['Metric', 'Baseline', 'Candidate', 'Difference', 'Value (95% interval)', 'Status'].map((t, i) => h('th', { class: i === 1 || i === 2 || i === 4 ? 'n' : '' }, t)))), h('tbody', null, metricRows)))),

function playground(query) {

        h('button', { class: 'btn', style: 'align-self:end', onclick: () => go().catch(e => toast(e.message)) }, 'Send'))), out);
}

function casesView() {

  const ta = h('textarea', { rows: 9 }, sample), res = h('div');

    h('div', { class: 'card', style: 'padding:20px' }, chips, h('div', { class: 'wrap', style: 'margin-top:12px' }, h('table', null, h('thead', null, h('tr', null, ['Case', 'Title', 'Tags', 'Rules'].map((t, i) => h('th', { class: i === 3 ? 'n' : '' }, t)))), body))),
    h('div', { class: 'card stack', style: 'margin-top:16px' }, h('h2', { style: 'margin:0' }, 'Case linter'), h('p', { class: 'mut', style: 'margin:0' }, 'Paste a case to validate its schema, severities and look for patient-data patterns before you commit it.'), ta,
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: async () => { const r = await post('/api/lint', { yaml: ta.value });
        res.replaceChildren(r.ok ? badge(`valid: ${r.n_cases} case(s)`, 'green') : h('ul', { class: 'clean' }, r.problems.map(p => h('li', null, badge('problem', 'red'), ' ', p)))); } }, 'Lint'), res)));
}

async function policyView() {
  const ws = await api('/api/waivers');
  const cs = h('select', null, S.suite.cases.map(c => h('option', { value: c.id }, `${c.id}: ${c.title}`)));
  const reason = h('input', { placeholder: 'Reason', minlength: 3 }), who = h('input', { placeholder: 'Approver', minlength: 2 }), when = h('input', { type: 'date', value: new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10) });
  const help = { tolerance: 'Allowed drop before a regression counts', confidence: 'Confidence level of the interval', bootstrap_samples: 'Resamples per comparison', min_cases: 'Fewer gated cases than this is inconclusive', block_on_critical: 'New critical detections block the merge',
    quarantine_flaky: 'Flaky non-safety cases never block', max_token_ratio: 'Warn when average tokens exceed this multiple of baseline' };
  return h('div', null, h('h1', null, 'Policy and waivers'), h('p', { class: 'lede' }, 'The gate policy lives in gate.yaml and is reviewed like code. Waivers are exceptions with a name and an expiry.'),
    h('div', { class: 'card', style: 'padding:12px 16px' }, h('table', null, h('tbody', null, Object.entries(S.policy).map(([k, v]) => h('tr', null, h('td', { class: 'mono' }, k), h('td', null, String(v)), h('td', { class: 'mut' }, help[k] || '')))))),
    h('div', { class: 'card', style: 'margin-top:16px' }, h('h2', null, 'Waivers'),
      ws.length ? h('div', { class: 'wrap' }, h('table', null, h('thead', null, h('tr', null, ['Case', 'Reason', 'Approver', 'Expires', ''].map(t => h('th', null, t)))), h('tbody', null, ws.map(w => h('tr', null, h('td', { class: 'mono' }, w.case_id), h('td', null, w.reason), h('td', null, w.approver),
        h('td', null, w.expires_at, w.expires_at < new Date().toISOString().slice(0, 10) ? [' ', badge('expired', 'gray')] : null),
        h('td', null, h('button', { class: 'btn alt sm', onclick: async () => { await api('/api/waivers/' + w.id, { method: 'DELETE' }); route(); } }, 'Remove'))))))) : h('p', { class: 'mut' }, 'No waivers.'),
      h('div', { class: 'row', style: 'margin-top:16px;align-items:end' }, h('label', { class: 'f' }, 'Case', cs), h('label', { class: 'f' }, 'Reason', reason), h('label', { class: 'f' }, 'Approver', who), h('label', { class: 'f' }, 'Expires', when),

async function auditView() {

/* ---------- router ---------- */
const VIEWS = [['overview', 'Overview'], ['runs', 'Runs'], ['compare', 'Compare'], ['playground', 'Playground'], ['cases', 'Cases'], ['policy', 'Policy'], ['audit', 'Audit']];
async function route() {
  const raw = location.hash.replace(/^#\/?/, '') || 'overview', [name, qs] = raw.split('?'), query = new URLSearchParams(qs || '');
  $('#tabs').replaceChildren(...VIEWS.map(([k, l]) => h('a', { href: '#/' + k, 'aria-current': k === name ? 'page' : null }, l)));
  try {
    await refresh();
    const v = { overview, runs, compare: compareView, playground: () => playground(query), cases: casesView, policy: policyView, audit: auditView }[name] || overview;
    $('#main').replaceChildren(await v());
  } catch (e) { $('#main').replaceChildren(h('div', { class: 'card' }, h('h2', null, 'Something went wrong'), h('p', { class: 'mut' }, e.message))); }
}
window.addEventListener('hashchange', route);
route();
