name: ClinEval-CI gate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Run the eval gate
        id: gate
        run: python -m clineval.cli gate
        continue-on-error: true
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('gate-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find(c => c.body.startsWith('# ClinEval-CI report'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - uses: actions/upload-artifact@v4
        with:
          name: clineval-report
          path: |
            gate-report.md
            gate-junit.xml
            gate-result.json
      - name: Fail the check if the gate blocked
        if: steps.gate.outcome == 'failure'
        run: exit 1
